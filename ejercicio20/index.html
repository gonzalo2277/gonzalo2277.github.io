<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 20</title>
</head>

<body>

    <h1>Ejercicio 20</h1>
    <p>Convertir una cadena a mayúsculas y minúsculas
        Escribe una función que convierta una cadena de texto a mayúsculas y luego a minúsculas, mostrando
        ambos resultados.
        Usa los métodos toUpperCase() y toLowerCase().
    </p>

    <input type="text" id="texto" placeholder="Escribe un texto">
    <button id="convertir">Convertir</button>

    <p id="mayusculas"></p>
    <p id="minusculas"></p>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
