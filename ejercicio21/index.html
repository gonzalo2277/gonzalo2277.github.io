<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 21</title>
</head>

<body>

    <h1>Ejercicio 21</h1>
    <p>Filtrar números mayores que un valor
        Escribe una función que tome un array de números y un valor, y devuelva un nuevo array con los números
        que son mayores que ese valor.
        Usa filter() para crear el nuevo array.
    </p>

    <input type="text" id="texto" placeholder="Escribe un texto">
    <button id="convertir">Convertir</button>

    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">
    <input type="number" id="num3" placeholder="Número 3">
    <input type="number" id="num4" placeholder="Número 4">
    <br><br>
    <input type="number" id="valor" placeholder="Valor">
    <button id="filtrar">Filtrar</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>

</html>
